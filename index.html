<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="header">

            <div class="logo">
                +
            </div>

            <h1>Create Your Account</h1>

            <p>
                Enter your details to get started
            </p>

        </div>


        <div class="form-card">

            <div class="form-heading">

                <h2>Account Information</h2>

                <p>
                    Please provide your details below.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-grid">


                    <div class="field">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input type="text" id="fullName" placeholder="Enter your full name">

                        <span class="error" id="nameError">
                        </span>

                    </div>


                    <div class="field">

                        <label for="username">
                            Username
                        </label>

                        <input type="text" id="username" placeholder="Choose a username">

                        <span class="error" id="usernameError">
                        </span>

                    </div>


                    <div class="field full">

                        <label for="email">
                            Email Address
                        </label>

                        <input type="text" id="email" placeholder="Enter your email address">

                        <span class="error" id="emailError">
                        </span>

                    </div>


                    <div class="field">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input type="text" id="phone" placeholder="Enter your phone number" minlength="11" maxlength="11">

                        <span class="error" id="phoneError">
                        </span>

                    </div>


                    <div class="field">

                        <label for="age">
                            Age
                        </label>

                        <input type="number" id="age" placeholder="Enter your age">

                        <span class="error" id="ageError">
                        </span>

                    </div>


                    <div class="field">

                        <label for="password">
                            Password
                        </label>

                        <input type="password" id="password" placeholder="Create a password">

                        <span class="error" id="passwordError">
                        </span>

                    </div>


                    <div class="field">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input type="password" id="confirmPassword" placeholder="Confirm your password">

                        <span class="error" id="confirmPasswordError">
                        </span>

                    </div>


                    <div class="field full">

                        <label for="country">
                            Country
                        </label>

                        <select id="country" required>

                            <option value="" selected disabled>
                                Select your country
                            </option>

                            <option value="Pakistan">
                                Pakistan
                            </option>

                            <option value="India">
                                India
                            </option>

                            <option value="UAE">
                                United Arab Emirates
                            </option>

                            <option value="UK">
                                United Kingdom
                            </option>

                            <option value="USA">
                                United States
                            </option>

                        </select>

                        <span class="error" id="countryError">
                        </span>

                    </div>

                </div>


                <button type="button" class="submit-btn" onclick="formSubmit()">

                    Create Account

                </button>


                <div class="success" id="successMessage">

                    Account created successfully.🎉

                </div>

            </form>

        </div>


        <div class="footer">
            Your information is securely handled.
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
